# /etc/nginx/sites-available/interviewsarathi
# Symlink: ln -s /etc/nginx/sites-available/interviewsarathi /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — Let's Encrypt (run: certbot --nginx -d yourdomain.com)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # File upload limit (resume PDFs)
    client_max_body_size 15M;

    # Proxy to FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";   # needed for WebSockets
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # long enough for Gemini calls
    }

    # Serve frontend static files directly (faster than going through FastAPI)
    location / {
        root   /var/www/interviewsarathi/frontend;
        index  index.html;
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        root    /var/www/interviewsarathi/frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check (no auth, no logging)
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
